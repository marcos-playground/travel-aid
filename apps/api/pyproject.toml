[project]
name = "travel-aid"
version = "0.1.0"
description = "Travel Aid backend: product API and AI planning workflow."
authors = [
    { name = "Marcos Mercado", email = "marcoscoca0905@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
export-openapi = "travel_aid.openapi:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.fastapi]
entrypoint = "travel_aid.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
